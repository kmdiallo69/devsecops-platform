# dev: AKS, VNet 10.10.0.0/16 (infra/terraform/environments/dev).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/aks-ingress
  - ../../components/aks-workload-identity

# The release running in dev. Newest release lands here first.
# Promotion = a reviewed PR changing this digest — nothing else moves.
images:
  - name: ghcr.io/kmdiallo69/llm-gateway
    digest: sha256:bbb2d5884266ba1006b02c6dbc2dc5b9c2687c353dff56cce1a8405c90792deb

replicas:
  - name: llm-gateway
    count: 2

patches:
  # Terraform output `ingress_ilb_ip` of this environment.
  - target:
      kind: Service
      name: llm-gateway
    patch: |-
      - op: replace
        path: /metadata/annotations/service.beta.kubernetes.io~1azure-load-balancer-ipv4
        value: 10.10.3.250
  # snet-appgw of this environment: the only source allowed into the pods.
  - target:
      kind: NetworkPolicy
      name: gateway-ingress-from-waf
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/ipBlock/cidr
        value: 10.10.4.0/24

# Dedicated identity for the workload (never the namespace's `default`).
# On AKS it is the Kubernetes side of Workload Identity: Entra ID trusts
# exactly system:serviceaccount:llm-gateway:llm-gateway.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: llm-gateway
automountServiceAccountToken: false

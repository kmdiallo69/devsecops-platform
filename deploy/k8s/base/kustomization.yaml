apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kustomize orders the output (Namespace first), unlike `kubectl apply -f .`
# which applies files alphabetically — a Deployment before its Namespace.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

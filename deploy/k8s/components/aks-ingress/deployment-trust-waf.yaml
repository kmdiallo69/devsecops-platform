# Pods are reachable only from the WAF subnet (networkpolicy-from-waf.yaml),
# so the last X-Forwarded-For entry is the WAF's view of the client: safe to
# use as the rate-limit key. Without this, every caller would share the
# WAF's IP — one bucket for everyone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  template:
    spec:
      containers:
        - name: llm-gateway
          env:
            - name: TRUST_FORWARDED_FOR
              value: "true"

# Shared by every AKS environment: the app is reached ONLY through the
# Application Gateway (WAF) -> internal load balancer -> pods.
# Each overlay sets its own ILB IP and WAF subnet (one VNet range per
# environment, so they can be peered later without overlap).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - networkpolicy-from-waf.yaml
patches:
  - path: service-internal-lb.yaml

# Runs on `git commit` — the cheapest place to stop a leaked secret is
# before it ever enters Git history (removing it afterwards means rewriting
# history AND rotating the secret anyway). The same Gitleaks scan runs
# again in CI (Step 2), because a local hook can be skipped with --no-verify.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^charts/.*/templates/
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

# Every container image must come from an allowed registry prefix — here,
# only the Artifactory virtual repository. Covers init and ephemeral
# containers too: `kubectl debug` is a classic way around image rules.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedregistries
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRegistries
      validation:
        openAPIV3Schema:
          type: object
          properties:
            prefixes:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedregistries

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.ephemeralContainers[_] }

        allowed(image) {
          prefix := input.parameters.prefixes[_]
          startswith(image, prefix)
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not allowed(c.image)
          msg := sprintf("container <%v>: image <%v> is not from an allowed registry %v",
            [c.name, c.image, input.parameters.prefixes])
        }

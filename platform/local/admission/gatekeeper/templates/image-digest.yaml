# Images must be referenced by digest. A tag is a mutable pointer — Step 3
# proved a tag can be moved in the registry; a digest IS the content, and
# it is what the signature (Kyverno policy) covers.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8simagedigest
spec:
  crd:
    spec:
      names:
        kind: K8sImageDigest
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8simagedigest

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.ephemeralContainers[_] }

        violation[{"msg": msg}] {
          c := containers[_]
          not regex.match(`@sha256:[a-f0-9]{64}$`, c.image)
          msg := sprintf("container <%v>: image <%v> must be pinned by digest (@sha256:...)",
            [c.name, c.image])
        }

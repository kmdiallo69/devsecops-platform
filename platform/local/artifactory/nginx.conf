# Reverse proxy in front of Artifactory for Docker clients.
#
# Docker always tries HTTPS first. Artifactory's router answers TLS on 8082
# but rejects connections without a known SNI name ("tls: unrecognized
# name"), so Docker never falls back to HTTP. This proxy only speaks HTTP:
# Docker gets "HTTP response to HTTPS client" and, for a loopback
# (insecure-by-default) registry, falls back cleanly.
# In a shared environment this is where TLS would terminate, with a real
# certificate.

server {
    listen 8085;

    # Image layers can be large; streaming instead of buffering them
    client_max_body_size 0;
    proxy_request_buffering off;
    chunked_transfer_encoding on;

    location / {
        proxy_pass         http://artifactory:8082;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }
}

# =============================================================================
# JFrog Container Registry (self-hosted Artifactory) + PostgreSQL
# =============================================================================
# The single trusted entry point for every container image: base images
# (Docker Hub) and our own images (GHCR, built + signed by CI) are pulled
# THROUGH Artifactory, never directly. Repositories are configuration as
# code (config/repositories.yml); full setup in SETUP.md.

name: artifactory

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artifactory
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifactory -d artifactory"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No `ports:` — the database is reachable only from Artifactory, on the
    # private compose network, never from the host or the LAN.

  artifactory:
    # Pinned version: `latest` would silently upgrade the registry (and
    # its database schema) on the next pull.
    image: releases-docker.jfrog.io/jfrog/artifactory-jcr:7.161.26
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      JF_SHARED_DATABASE_URL: jdbc:postgresql://postgres:5432/artifactory
      JF_SHARED_DATABASE_USERNAME: artifactory
      JF_SHARED_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to 127.0.0.1: reachable from this machine only, not from the
      # network. Port 8082 = JFrog router (UI, REST API, Docker registry).
      - "127.0.0.1:8082:8082"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
    ulimits:
      nofile:
        soft: 32000
        hard: 40000

  # Docker clients use 127.0.0.1:8085 (see nginx.conf for why).
  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    depends_on:
      - artifactory
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
  artifactory-data:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-gateway
  labels:
    app: llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      # The app never calls the Kubernetes API: no token mounted to steal.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: artifactory-pull # cluster-reader: read-only
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-gateway
          # Through Artifactory, by DIGEST (the signed release index from
          # Step 4) — never a tag, which can be moved.
          image: registry.local:8085/docker/kmdiallo69/llm-gateway@sha256:2d03281013ea2d98f3cec22c2fc5940b42863fd98ef83e9bd0f451b28898976e
          # Always: every pod start re-authenticates to the registry, so a
          # revoked pull credential takes effect immediately, even for an
          # image already cached on the node.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LLM_PROVIDER
              value: mock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Read-only root filesystem: the only writable place, small and
        # wiped on restart.
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi

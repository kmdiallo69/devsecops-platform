# Pod Security Admission, `restricted` profile, ENFORCED: the API server
# itself refuses any pod that is privileged, runs as root, keeps Linux
# capabilities, allows privilege escalation or has no seccomp profile.
# Built into Kubernetes — no add-on to install, bypass or crash.
apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

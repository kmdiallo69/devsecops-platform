# Falco — runtime threat detection. Chart version pinned in install.sh.
#
# Admission control (Step 5) decides what may START; Falco watches what a
# running container actually DOES — the only layer that sees an attacker
# who got in through the application itself (RCE, SSRF, a poisoned
# dependency doing something at runtime).

driver:
  # CO-RE eBPF probe: no kernel module to build or load on the node.
  kind: modern_ebpf

# Flush every event immediately (no buffered, late alerts).
tty: true

falco:
  json_output: true
  json_include_output_property: true

# Alert routing: Falcosidekick fans events out to any destination (Slack,
# Teams, PagerDuty, a SIEM...). Here: its web UI, so alerts can be seen
# without any external account.
falcosidekick:
  enabled: true
  replicaCount: 1
  webui:
    enabled: true
    replicaCount: 1
    # The chart's default login is admin:admin. This secret (created by
    # install.sh from the keychain) is loaded last, so it overrides it.
    existingSecret: falco-ui-credentials # checkov:skip=CKV_SECRET_6: the NAME of a Secret, not a secret value

# Application-specific rules: the default ruleset knows generic attacks;
# these know what THIS workload is supposed to do — so anything else is
# suspicious by definition.
customRules:
  llm-gateway-rules.yaml: |-
    - list: llm_gateway_processes
      items: [python, python3, python3.12, uvicorn]

    - macro: llm_gateway_container
      condition: (k8s.ns.name = "llm-gateway" and container.name = "llm-gateway")

    # The image runs exactly one program. A shell, `id`, curl, a package
    # manager... is either an intrusion or a debugging session nobody
    # announced — both deserve an alert.
    - rule: Unexpected process in LLM gateway
      desc: A process other than the gateway itself started in the llm-gateway container
      # Tuned after the first test: runc's own bootstrap process for each
      # `kubectl exec` (`<fd> init`, parent runc, uid 0) is runtime plumbing,
      # not a process the container ran — it fired 2 noise alerts per exec.
      # The process the exec actually runs is still alerted on.
      condition: >-
        spawned_process and llm_gateway_container
        and not proc.name in (llm_gateway_processes)
        and not (proc.pname = runc and proc.args = init)
      output: >-
        Unexpected process in LLM gateway (process=%proc.name cmdline=%proc.cmdline
        parent=%proc.pname uid=%user.uid pod=%k8s.pod.name ns=%k8s.ns.name
        image=%container.image.repository)
      priority: CRITICAL
      tags: [llm_gateway, mitre_execution, T1059]

    # NetworkPolicy already BLOCKS the gateway's internet egress (Step 5);
    # this rule detects the ATTEMPT. Prevention says "no", detection says
    # "someone tried" — e.g. an SSRF or a prompt-injected tool call trying
    # to exfiltrate data.
    - rule: LLM gateway outbound connection attempt
      desc: The llm-gateway container tried to connect outside the cluster networks
      condition: outbound and llm_gateway_container
      output: >-
        LLM gateway tried to reach the outside (dest=%fd.sip:%fd.sport process=%proc.name
        cmdline=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [llm_gateway, mitre_exfiltration, T1041]

# Pinning everything (action SHAs, hashed Python lockfile, base image) only
# stays safe if the pins are kept current — Dependabot opens the update PRs,
# and the security CI gates them like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /apps/llm-gateway
    schedule:
      interval: weekly

  # Base image: digest refreshes and patch tags only. A Python minor
  # upgrade (3.12 -> 3.15) is a deliberate change — lockfile recompiled for
  # the new interpreter, tests re-run — not a weekly bot PR that cannot
  # build (the lockfile is compiled for 3.12).
  - package-ecosystem: docker
    directory: /apps/llm-gateway
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

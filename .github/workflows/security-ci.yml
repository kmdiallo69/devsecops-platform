# =============================================================================
# Security CI — every PR must pass these gates before it can be merged
# =============================================================================
# Gate            Tool              Catches
# --------------  ----------------  -------------------------------------------
# secrets         Gitleaks          credentials committed anywhere in history
# sast            Semgrep           insecure code patterns (OWASP Top 10)
# sca             pip-audit         known CVEs in Python dependencies
# iac             Checkov, Hadolint misconfigured Dockerfile/K8s/Terraform/CI
# tests           pytest            security behaviour regressions (Step 1)
# image           Trivy             CVEs in the built image (OS + libraries)
# infra           terraform, kubectl Terraform fmt/validate on every root;
#                                   every Kustomize overlay renders
#
# The pipeline is itself an attack target (it holds credentials and produces
# what runs in production), so it is hardened too:
#   - every third-party action pinned to a full commit SHA: a tag like @v4
#     can be moved by whoever controls that repo (tj-actions/changed-files,
#     March 2025, leaked secrets from thousands of pipelines that way).
#     Dependabot (.github/dependabot.yml) keeps the SHAs up to date.
#   - `permissions: {}` at the top: the GITHUB_TOKEN starts with NO rights,
#     each job is granted only what it needs.
#   - `persist-credentials: false`: the checkout token is not left on disk
#     for later steps (or a compromised tool) to reuse.
#
# No `paths:` filter: a required check that never runs (because the PR
# touched no matching path) leaves the PR blocked on "Expected — waiting".

name: security-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/llm-gateway

jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted in a later commit is still leaked
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts; a GitHub *organization* needs a
          # (free) GITLEAKS_LICENSE secret — or run the gitleaks CLI directly.
          GITLEAKS_ENABLE_COMMENTS: "false" # would need pull-requests: write

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the repo's Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Semgrep
        run: >
          uvx semgrep==1.185.0 scan
          --config p/python --config p/owasp-top-ten --config p/dockerfile
          --metrics=off --error
          --sarif-output=semgrep.sarif
          apps/
      - name: Upload findings to the Security tab
        if: always() # findings must be visible precisely when the gate fails
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # --disable-pip: audits the hashed lockfile as-is, nothing is installed
      - name: pip-audit
        run: uvx pip-audit==2.10.1 -r "$APP_DIR/requirements.txt" --require-hashes --disable-pip

  iac:
    name: IaC & Dockerfile (Checkov, Hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scans everything it recognises: Dockerfiles and GitHub workflows
      # today, Kubernetes manifests (Step 5) and Terraform (Step 7) later.
      # Pin found by listing TAGS, not "latest release": this repo's last
      # GitHub release is from 2022 (v12.1347.0 = Checkov 2.0.930) — pinning
      # that SHA silently ran a 4-year-old scanner.
      - name: Checkov
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12.3142.0
        with:
          directory: .
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - name: Upload Checkov findings
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: checkov.sarif
          category: checkov
      # Runs even if Checkov failed: one gate failing must not hide another
      # gate's findings (first CI run: Checkov errored and Hadolint was skipped).
      - name: Hadolint
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ env.APP_DIR }}/Dockerfile
          failure-threshold: warning

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv venv --python 3.12
      - run: uv pip install --require-hashes -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -v

  image:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --pull: always start from the CURRENT base image, never a stale
      # cached one — otherwise a fixed base CVE would keep failing (or a
      # new one would go unnoticed).
      - name: Build
        run: docker build --pull -t "llm-gateway:${GITHUB_SHA}" "$APP_DIR"
      # ignore-unfixed: a CVE with no available fix cannot be acted on by
      # this PR — it is tracked, not used to block every merge.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-gateway:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infra:
    name: Infra as code (Terraform, Kustomize)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform
      # Every root (bootstrap + each environment) validated WITHOUT a backend
      # or credentials: CI proves the code is correct, never touches state.
      # Providers come from each root's lock file (checksums verified).
      - name: terraform validate
        run: |
          for root in infra/terraform/bootstrap infra/terraform/subscription infra/terraform/environments/*/; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done
      # A broken overlay (bad patch path, missing resource) fails here, not
      # during a deployment.
      - name: kustomize build
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" > /dev/null
            echo "ok"
            echo "::endgroup::"
          done

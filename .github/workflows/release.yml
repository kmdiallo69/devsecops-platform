# =============================================================================
# Release — build, scan, publish, sign, attest
# =============================================================================
# Runs on every merge to main that changes the app. Produces ONE immutable
# reference — ghcr.io/<owner>/llm-gateway@sha256:… — and three verifiable
# claims about it, all signed keylessly (Sigstore):
#
#   Claim                 Tool                      Answers
#   --------------------  ------------------------  ---------------------------
#   signature             cosign sign               "did OUR pipeline make it?"
#   SBOM (SPDX)           Syft + cosign attest      "what is inside it?"
#   SLSA build provenance attest-build-provenance   "from which commit, which
#                                                    workflow, which runner?"
#
# Keyless: no private key exists anywhere to steal or rotate. The job's
# GitHub OIDC token proves its identity (this repo + this workflow + this
# branch) to Sigstore's Fulcio CA, which issues a 10-minute certificate; the
# signature is recorded in the public Rekor transparency log. Verifiers pin
# that identity — see scripts/verify-release.sh.
#
# Why sign the DIGEST, never a tag: a tag is a mutable pointer (Step 3
# proved it can be swapped in the registry); a digest is the content itself.

name: release

on:
  push:
    branches: [main]
    paths:
      - apps/llm-gateway/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions: {}

# Never cancel a release half-way (pushed but not signed yet): queue instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  APP_DIR: apps/llm-gateway
  IMAGE: ghcr.io/${{ github.repository_owner }}/llm-gateway

jobs:
  release:
    name: Build, sign, attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # OIDC token -> Sigstore keyless certificate
      attestations: write # store the provenance attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One single-platform manifest, always (no buildx attestation index):
      # a consistent format is what makes the registry's no-overwrite rule
      # effective (Step 3 finding). Attestations are attached by cosign.
      - name: Build
        run: docker build --pull -t "${IMAGE}:sha-${GITHUB_SHA}" "$APP_DIR"

      # Scanned again at release time, not only on the PR: a CVE published
      # between the PR and the merge must not get signed.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is only a human-readable label; everything below targets
      # the digest the registry returned.
      - name: Push
        id: push
        run: |
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${GITHUB_SHA}" | cut -d@ -f2)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          syft-version: v1.57.2

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # would need an extra permission

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Released"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo "Verify: \`scripts/verify-release.sh ${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

# =============================================================================
# Release — build, publish, scan, sign, attest
# =============================================================================
# Runs on every merge to main that changes the app. Produces ONE immutable
# reference — ghcr.io/<owner>/llm-gateway@sha256:… (a linux/amd64 +
# linux/arm64 index) — and three verifiable claims about it, all signed
# keylessly (Sigstore):
#
#   Claim                 Tool                      Answers
#   --------------------  ------------------------  ---------------------------
#   signature             cosign sign               "did OUR pipeline make it?"
#   SBOM (SPDX)           Syft + cosign attest      "what is inside it?"
#   SLSA build provenance attest-build-provenance   "from which commit, which
#                                                    workflow, which runner?"
#
# Keyless: no private key exists anywhere to steal or rotate. The job's
# GitHub OIDC token proves its identity (this repo + this workflow + this
# branch) to Sigstore's Fulcio CA, which issues a 10-minute certificate; the
# signature is recorded in the public Rekor transparency log. Verifiers pin
# that identity — see scripts/verify-release.sh.
#
# Why sign the DIGEST, never a tag: a tag is a mutable pointer (Step 3
# proved it can be swapped in the registry); a digest is the content itself.
#
# Pushed BEFORE the scan, signed only AFTER it: an image that fails the scan
# stays in the registry unsigned — and unsigned means undeployable, because
# the cluster admits signed digests only (Step 5).

name: release

on:
  push:
    branches: [main]
    paths:
      - apps/llm-gateway/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions: {}

# Never cancel a release half-way (pushed but not signed yet): queue instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  APP_DIR: apps/llm-gateway
  IMAGE: ghcr.io/${{ github.repository_owner }}/llm-gateway
  # Classic signature storage: `sha256-<digest>.sig` / `.att` TAGS. The
  # newer default (OCI 1.1 referrers) is invisible through a registry proxy
  # that answers the referrers API with an empty list — Artifactory does,
  # so consumers pulling through it found "no signatures" (Step 4 finding).
  COSIGN_FORMAT: --new-bundle-format=false --use-signing-config=false

jobs:
  release:
    name: Build, sign, attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # OIDC token -> Sigstore keyless certificate
      attestations: write # store the provenance attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same format on every release: an index of exactly two images.
      # BuildKit's own attestation manifests are turned off (they would add
      # an "unknown/unknown" entry to the index); ours come from cosign and
      # attest-build-provenance below. A consistent format is what makes the
      # registry's no-overwrite rule effective (Step 3 finding).
      - name: Build and push (amd64 + arm64)
        id: build
        run: |
          docker buildx build --pull \
            --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --metadata-file metadata.json \
            --push "$APP_DIR"
          echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"

      # Scanned again at release time, not only on the PR: a CVE published
      # between the PR and the merge must not get signed. Both platforms:
      # their OS packages are different binaries.
      - name: Trivy scan (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.57.2

      # --recursive: signs the index AND each platform image, so a
      # reference to either one verifies.
      - name: Sign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive $COSIGN_FORMAT "${IMAGE}@${DIGEST}"

      # One SBOM per platform, attested on that platform's own digest:
      # an arm64 image does not contain the same packages as an amd64 one.
      - name: SBOM per platform (Syft, SPDX) + attest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          for arch in amd64 arm64; do
            pdigest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
              | jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest')"
            "$SYFT" scan "registry:${IMAGE}@${pdigest}" -o "spdx-json=sbom-${arch}.spdx.json"
            cosign attest --yes $COSIGN_FORMAT --type spdxjson \
              --predicate "sbom-${arch}.spdx.json" "${IMAGE}@${pdigest}"
          done

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # would need an extra permission

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Released"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo "Verify: \`scripts/verify-release.sh ${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
